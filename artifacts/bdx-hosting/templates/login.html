<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>T10-MEHEDI — Login</title>
<link rel="stylesheet" href="{{ bp }}/static/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☁️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="auth-body">

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
    </div>
    <h1 class="login-title"><span class="white">T10</span><span class="blue">-MEHEDI</span></h1>
    <p class="login-sub">Premium Hosting Solution</p>

    {% if error %}
    <div class="alert alert-error"><i class="fa fa-triangle-exclamation"></i> {{ error }}</div>
    {% endif %}

    <form method="POST" autocomplete="off">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter username" required autofocus>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn-login">
        <i class="fa fa-right-to-bracket"></i> Login
      </button>
    </form>

    <p class="login-footer"><i class="fa fa-shield-halved"></i> Secure Access Only</p>
    <a href="{{ bp }}/admin" class="admin-link">Admin Panel</a>
  </div>
</div>

</body>
</html>
