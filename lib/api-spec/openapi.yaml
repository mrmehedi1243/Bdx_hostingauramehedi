openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: T10-MEHEDI API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: admin
    description: Admin authentication
  - name: apikeys
    description: API key management
  - name: users
    description: User management
  - name: dashboard
    description: Dashboard statistics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login with access key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Invalid access key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/verify:
    get:
      operationId: adminVerify
      tags: [admin]
      summary: Verify admin session
      responses:
        "200":
          description: Session valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /apikeys:
    get:
      operationId: listApiKeys
      tags: [apikeys]
      summary: List all API keys (admin)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, expired, revoked]
      responses:
        "200":
          description: List of API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
    post:
      operationId: createApiKey
      tags: [apikeys]
      summary: Create a new API key (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"

  /apikeys/{id}:
    get:
      operationId: getApiKey
      tags: [apikeys]
      summary: Get a single API key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: API key details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteApiKey
      tags: [apikeys]
      summary: Delete an API key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /apikeys/{id}/revoke:
    post:
      operationId: revokeApiKey
      tags: [apikeys]
      summary: Revoke an API key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user via API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Bad request or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success, message]

    AdminLoginInput:
      type: object
      properties:
        accessKey:
          type: string
      required: [accessKey]

    AdminSession:
      type: object
      properties:
        authenticated:
          type: boolean
        token:
          type: string
      required: [authenticated, token]

    ApiKey:
      type: object
      properties:
        id:
          type: integer
        key:
          type: string
        label:
          type: string
        status:
          type: string
          enum: [active, expired, revoked]
        usageCount:
          type: integer
        maxUsers:
          type: ["integer", "null"]
        expiresAt:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, key, label, status, usageCount, createdAt]

    ApiKeyInput:
      type: object
      properties:
        label:
          type: string
        maxUsers:
          type: ["integer", "null"]
      required: [label]

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        password:
          type: string
        apiKeyId:
          type: integer
        apiKey:
          type: string
        status:
          type: string
          enum: [active, expired]
        expiresAt:
          type: string
        createdAt:
          type: string
      required: [id, username, password, apiKeyId, apiKey, status, expiresAt, createdAt]

    UserInput:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        apiKey:
          type: string
      required: [username, password, apiKey]

    DashboardStats:
      type: object
      properties:
        totalApiKeys:
          type: integer
        activeApiKeys:
          type: integer
        totalUsers:
          type: integer
        activeUsers:
          type: integer
        expiredUsers:
          type: integer
        recentUsers:
          type: array
          items:
            $ref: "#/components/schemas/User"
      required: [totalApiKeys, activeApiKeys, totalUsers, activeUsers, expiredUsers, recentUsers]
